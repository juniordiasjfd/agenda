{# Conteúdo do modal de exclusão (HTMX). Contexto: ausencia, voltar. #}
<div class="modal-content">
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
  <div class="modal-status bg-danger"></div>
  <div class="modal-body text-center py-4">
    <i class="fa-solid fa-trash-can text-danger fs-1 mb-3 d-block"></i>
    <h3>Excluir ausência?</h3>
    <div class="text-secondary">
      {{ ausencia.titulo }} <span class="font-monospace">({{ ausencia.codigo }})</span> vai para a lixeira.
      Qualquer gestor pode restaurá-la depois.
    </div>
    {% include "ausencias/_form_excluir.html" %}
  </div>
  <div class="modal-footer">
    <div class="w-100 row g-2">
      <div class="col"><button type="button" class="btn w-100" data-bs-dismiss="modal">Cancelar</button></div>
      <div class="col">
        <button type="submit" form="form-excluir" class="btn btn-danger w-100">
          <i class="fa-solid fa-trash-can me-2"></i>Excluir
        </button>
      </div>
    </div>
  </div>
</div>
