{% if messages %}
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible" role="alert">
      {{ message }}
      <a class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></a>
    </div>
  {% endfor %}
{% endif %}
